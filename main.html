<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
	   <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>
	<!-- the entire body must be written by student -->

<form>
  <div>
    <label for="first-name-input">First Name</label>
    <input
      type="text"
      id="first-name-input"
      required
    >
    <div class="invalid-feedback">
      First name required!
    </div>
  </div>

  <div>
    <label for="last-name-input">Last Name</label>
    <input
      type="text"
      id="last-name-input"
      required
    >
    <div class="invalid-feedback">
      Last name required!
    </div>
  </div>

  <div>
    <label for="email-input">Email Address</label>
    <input
      type="email"
      id="email-input"
      placeholder="xyz@abc.com"
      required
    >
    <div class="invalid-feedback">
      Email required!
    </div>
  </div>

  <div>
    <label for="college-input">College</label>
    <input
      type="text"
      id="college-input"
      required
    >
    <div class="invalid-feedback">
      Please provide a valid college.
    </div>
  </div>

  <div>
    <label for="graduation-year">Graduation Year</label>
    <select id="graduation-year" required>
      <option value="">Choose...</option>
      <option value="2020">2020</option>
      <option value="2021">2021</option>
      <option value="2022">2022</option>
      <option value="2023">2023</option>
    </select>
    <div class="invalid-feedback">
      Please select a valid Graduation Year.
    </div>
  </div>

  <div>
    <label for="roll-no-input">Roll No.</label>
    <input
      type="text"
      id="roll-no-input"
      required
    >
    <div class="invalid-feedback">
      Please provide a valid Roll no.
    </div>
  </div>

  <div>
    <input
      type="checkbox"
      id="conditions-checkbox"
      required
    >
    <label for="conditions-checkbox">
      Agree to terms and conditions
    </label>

    <div class="invalid-feedback">
      You must agree before submitting.
    </div>
  </div>

  <button type="submit">Submit form</button>
</form>

     
	
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
